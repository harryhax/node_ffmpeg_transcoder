name: Build and Release pkg binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build SEA on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            osname: linux-x64
          - os: windows-latest
            osname: win-x64
          - os: macos-13
            osname: macos-x64
          - os: macos-14
            osname: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SEA binary and zip
        run: node scripts/build-sea.mjs --zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-ffmpeg-rencode-videos-${{ matrix.osname }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.zip
          generate_release_notes: true
